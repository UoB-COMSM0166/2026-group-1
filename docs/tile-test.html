<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tile Render Diagnostic - THE ABYSS</title>
<style>
body{background:#0d1117;color:#e6edf3;font-family:monospace;margin:20px;font-size:13px}
h1{font-size:15px;color:#f0f6fc}
h2{font-size:13px;color:#8b949e;margin:16px 0 4px;border-bottom:1px solid #21262d;padding-bottom:4px}
.ok{color:#3fb950}.fail{color:#f85149}.warn{color:#d29922}.info{color:#58a6ff}.dim{color:#8b949e}
canvas{border:1px solid #30363d;margin:6px 0;display:block}
#results{max-width:900px}.r{margin:1px 0;font-size:12px}
.sec{margin:12px 0;padding:10px;background:#161b22;border-radius:6px;border:1px solid #21262d}
#s{position:sticky;top:0;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 14px;z-index:10;margin-bottom:16px;font-size:12px}
.b{font-weight:bold}
</style>
</head>
<body>
<h1>Tile Render Diagnostic - THE ABYSS</h1>
<div id="s">Detecting server...</div>
<div id="results"></div>
<script src="p5.js"></script>
<script>
// Serve from docs/: cd docs && python3 -m http.server 3000
// Auto-detects ports: 3000, 5500, 5000, 8080, 8000, 5173

var TILESETS=[
  {name:"prototype",  source:"data/tilesets/prototype-tileset/prototype-tileset.tsx",  firstgid:1},
  {name:"atlantis-1", source:"data/tilesets/Atlantis/atlantis-tileset-1.tsx",       firstgid:111},
  {name:"atlantis-2", source:"data/tilesets/Atlantis/atlantis-tileset-2.tsx",       firstgid:687},
  {name:"atlantis-3", source:"data/tilesets/Atlantis/atlantis-tileset-3.tsx",       firstgid:1263},
];
var TEST_GIDS=[23,508];
var metaCache={},atlasCache={};
var el=document.getElementById('results'),sel=document.getElementById('s');
var detectedBase=null;

function log(m,t){t=t||"info";console.log("[tile] "+m);
  var d=document.createElement("div");d.className="r "+t;d.textContent=m;el.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);}
function ss(h){var s=document.createElement("div");s.className="sec";
  var x=document.createElement("h2");x.textContent=h;s.appendChild(x);el.appendChild(s);return s;}
function sh(h){sel.innerHTML=h;}

function nr(bp,rp){
  var b=String(bp).split("/").filter(Boolean);
  var r=String(rp||"").split("/").filter(Boolean);
  for(var i=0;i<r.length;i++){var p=r[i];
    if(p===".")continue;if(p===".."){b.pop();continue;}
    b.push(p);}return b.join("/");}
function dp(p){var b=String(p||"").split("/").filter(Boolean);b.pop();return b.join("/");}
function fb(src,md){
  md=md||"data/rooms";if(!src)return null;
  var r=nr(md,src),d=dp(r),f=r.split("/").pop().replace(/\.tsx$/i,".png");
  return nr(d,f);}
function px(xml,sp){
  sp=sp||"";var pd=new DOMParser().parseFromString(xml,"application/xml");
  var ts=pd.querySelector("tileset");if(!ts)return null;
  var bd=dp(sp),ri=ts.querySelector("image"),rs=ri?ri.getAttribute("source"):null;
  var ip=rs?nr(bd,rs):null;
  return{ip:ip,tw:Number(ts.getAttribute("tilewidth")||0)||16,th:Number(ts.getAttribute("tileheight")||0)||16,
         cols:Number(ts.getAttribute("columns")||0)||24,count:Number(ts.getAttribute("tilecount")||0)||576};}
function gg(g){
  var b=null;
  for(var i=0;i<TILESETS.length;i++){var t=TILESETS[i],f=Number(t.firstgid||0);
    if(!f||g<f)continue;if(!b||f>b.firstgid)b={...t,firstgid:f};}
  return b;}
function ft(u,o,ms){
  o=o||{};ms=ms||8000;
  return new Promise(function(rs,rj){
    var c=(typeof AbortController!=="undefined")?new AbortController():null;
    var id=setTimeout(function(){if(c)c.abort();},ms);
    var io=c?Object.assign({},o,{signal:c.signal}):o;
    fetch(u,io).then(function(r){clearTimeout(id);rs(r);}).catch(function(e){clearTimeout(id);rj(e);});});}
function gt(u){return new Promise(function(rs){
  log("[fetch] GET "+u,"dim");
  ft(u,{},8000).then(function(r){log("[fetch] "+r.status+" "+u,r.ok?"dim":"fail");
    if(!r.ok){rs(null);return;}
    if(r.status===204){rs("");return;}
    r.text().then(rs).catch(function(){rs(null);});})
    .catch(function(e){log("[fetch] ERROR "+u+" "+e.name,"fail");rs(null);});});}
function li(u){return new Promise(function(rs){
  log("[p5.li] START "+u,"dim");
  if(typeof loadImage==="undefined"){log("[p5.li] loadImage missing","fail");rs(null);return;}
  loadImage(u,function(img){log("[p5.li] OK "+u+" = "+img.width+"x"+img.height,"ok");rs(img);},
            function(e){log("[p5.li] FAIL "+u+" = "+e,"fail");rs(null);});});}

var COMMON=[5501,3000,5500,5000,8080,8000,5173,4200];
var pi=0;
function tp(){
  if(pi>=COMMON.length){
    log("[PORT] No server on "+COMMON.join(", "),"fail");
    sh("<span style='color:#f85149'><b>No server found.</b> Run: cd docs && python3 -m http.server 3000</span>");
    detectedBase=null;finished=true;return;}
  var port=COMMON[pi++];
  var base="http://127.0.0.1:"+port;
  log("[port] Trying "+base+"...","dim");
  ft(base+"/data/tilesets/Atlantis/Tileset1.png",{method:"HEAD"},1500)
    .then(function(r){
      if(r&&r.ok){detectedBase=base;log("[port] FOUND "+base,"ok");
        sh("Server: <b>"+base+"</b> - running diagnostic...");finished=false;runAll().then(function(){finished=true;});}
      else{log("[port] "+base+" not this one","dim");tp();}})
    .catch(function(e){log("[port] "+base+" "+e.name,"dim");tp();});}

var finished=false;
function setup(){log("=== SETUP p5="+(typeof p5!=="undefined"?"OK":"MISSING"),typeof p5!=="undefined"?"ok":"fail");createCanvas(10,10);tp();}
function draw(){if(!finished){background(30);fill(200);textAlign(CENTER,CENTER);text("Detecting...",5,5);textAlign(LEFT);}}

function runAll(){return new Promise(function(ra){
  if(!detectedBase){ra();return;}
  log("");log("=== START base="+detectedBase+" ===","info");

  // Step 1: TSX
  ss("STEP 1: TSX parse");var s1=0;
  TILESETS.forEach(function(t){
    t._resolved=t.source;
    gt(detectedBase+"/"+t.source).then(function(xml){
      if(!xml){log("  FAIL: TSX 404: "+t.source,"fail");metaCache[t.source]=null;}
      else{var m=px(xml,t.source);metaCache[t.source]=m;t._meta=m;t._fromTsx=m.ip;t._fromFallback=fb(t.source,"data/rooms");
        var same=t._fromTsx===t._fromFallback;
        log("  OK: "+t.name+" tiles="+m.count+" "+m.tw+"x"+m.th+" cols="+m.cols,"ok");
        var msg="  tsx <image>: "+(t._fromTsx||"NONE");
        if(same)msg+=" [SAME as fallback - file may be correct or wrong";
        else if(t._fromTsx)msg+=" [DIFFERENT from fallback - use this if file exists]";
        log(msg,same?"warn":(t._fromTsx?"ok":"warn"));
        log("  fallback: "+t._fromFallback,"dim");}
      s1++;if(s1===TILESETS.length)step2();
    });});

  // Step 2: HTTP HEAD
  function step2(){
    ss("STEP 2: HTTP HEAD atlas files");var s2=0;
    TILESETS.forEach(function(t){
      if(!metaCache[t.source]){s2++;if(s2===TILESETS.length)step3();return;}
      var ps=[];if(t._fromTsx)ps.push(t._fromTsx);
      if(t._fromFallback&&t._fromFallback!==t._fromTsx)ps.push(t._fromFallback);
      var seen={};ps=ps.filter(function(p){if(seen[p])return false;seen[p]=true;return true;});
      if(!ps.length){log("  SKIP: "+t.name+" no path","warn");t._exists=false;s2++;if(s2===TILESETS.length)step3();return;}
      var ok=false,tr=0;
      ps.forEach(function(p){
        ft(detectedBase+"/"+p,{method:"HEAD"},3000).then(function(r){
          if(r&&r.ok){log("  OK: "+p+" EXISTS","ok");ok=true;}
          else{log("  FAIL: "+p+" HTTP "+(r?r.status:"?"),"fail");}
          tr++;if(tr===ps.length&&!ok)log("  ALL 404: "+t.name,"fail");
          t._exists=ok;s2++;if(s2===TILESETS.length)step3();
        }).catch(function(e){log("  ERROR: "+p+" "+e.name,"fail");tr++;
          if(tr===ps.length&&!ok){log("  ALL ERROR: "+t.name,"fail");t._exists=false;}
          s2++;if(s2===TILESETS.length)step3();});});
    });}

  // Step 3: p5 loadImage
  function step3(){
    ss("STEP 3: p5.js loadImage");var s3=0;
    TILESETS.forEach(function(t){
      if(!metaCache[t.source]){s3++;if(s3===TILESETS.length)step4();return;}
      var p=t._fromTsx||t._fromFallback;
      if(!p){log("  SKIP: "+t.name+" no path","warn");t._loaded=false;s3++;if(s3===TILESETS.length)step4();return;}
      li(detectedBase+"/"+p).then(function(img){
        if(img&&img.width>0){atlasCache[t.source]={img:img,w:img.width,h:img.height};
          t._loaded=true;t._w=img.width;t._h=img.height;
          log("  OK: "+t.name+" loaded "+img.width+"x"+img.height,"ok");}
        else{atlasCache[t.source]={img:null,w:0,h:0};t._loaded=false;
          log("  FAIL: "+t.name+" img="+(img?"w=0":"null")+" (likely 404 -> p5 placeholder)","fail");}
        s3++;if(s3===TILESETS.length)step4();
      });});
  }

  // Step 4: render
  function step4(){
    ss("STEP 4: Tile render preview");
    var ld=TILESETS.filter(function(t){return t._loaded;}).length;
    sh("<b>Result: "+ld+"/"+TILESETS.length+" atlases loaded on "+detectedBase+"</b>  |  Green=OK  Red=MISSING");
    log("Result: "+ld+"/"+TILESETS.length+" loaded on "+detectedBase,"ok");
    log("If steps 1-3 all OK but tiles are red: tile coords out of bounds for this GID","info");
    log("If step 2 shows all FAIL: server path is wrong","info");
    log("","info");log("=== DIAGNOSTIC COMPLETE ===","ok");ra();}
});}
</script>
</body>
</html>
